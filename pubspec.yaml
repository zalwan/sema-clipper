name: sema_clipper
description: "On-device vertical video clipping and captioning for Android."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.12.2

dependencies:
  ffmpeg_kit_flutter_new: ^4.6.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  saver_gallery: ^5.1.0
  share_plus: 13.3.0
  video_player: ^2.14.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/LICENSE-DejaVu.txt
